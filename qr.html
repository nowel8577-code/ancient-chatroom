<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>古人聊天室 QR Code</title>
<style>
  body{margin:0;font-family:"Noto Serif TC","Microsoft JhengHei",serif;background:#f4ecd8;color:#3b2f24;padding:24px;text-align:center}
  h1{color:#8a2a1e;margin:0 0 4px}
  .row{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;margin-top:20px}
  figure{margin:0;background:#fff;border:1px solid #d9c9a3;border-radius:14px;padding:16px;width:280px}
  img{width:100%;image-rendering:pixelated}
  figcaption b{display:block;font-size:22px;margin-top:6px}
  figcaption span{font-size:12px;word-break:break-all;opacity:.7}
  @media print{body{background:#fff}}
</style>
</head>
<body>
<h1>古人聊天室</h1>
<p>手機掃描 QR Code 即可進入（可投影或列印）</p>
<div class="row">
  <figure><img src="qr/su.png" alt="蘇軾"><figcaption><b>蘇軾聊天室</b><span>…/ancient-chatroom/su/</span></figcaption></figure>
  <figure><img src="qr/hanyu.png" alt="韓愈"><figcaption><b>韓愈聊天室</b><span>…/ancient-chatroom/hanyu/</span></figcaption></figure>
  <figure><img src="qr/home.png" alt="首頁"><figcaption><b>選擇古人（首頁）</b><span>…/ancient-chatroom/</span></figcaption></figure>
</div>
</body>
</html>
